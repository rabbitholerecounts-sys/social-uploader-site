<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>TikTok Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    code#code { display:block; word-break:break-all; font-size:15px; padding:14px;
      background:var(--bg); border:1px solid var(--border); border-radius:8px; margin:12px 0; }
    button { font:inherit; padding:10px 18px; border-radius:8px; border:1px solid var(--accent);
      background:var(--accent); color:#fff; cursor:pointer; }
  </style>
</head>
<body>
<div class="wrap">
  <nav><a class="brand" href="./">social-uploader</a></nav>
  <h1>TikTok login</h1>
  <div class="card" id="ok" hidden>
    <p>Login approved. Copy this code and paste it into the uploader's terminal window:</p>
    <code id="code"></code>
    <button id="copy" type="button">Copy code</button>
    <p class="updated">The code works once and expires in a few minutes. Nothing is stored on this page.</p>
  </div>
  <div class="card" id="err" hidden>
    <p>TikTok didn't return a code.</p>
    <p class="updated" id="errmsg"></p>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get("code");
  if (code) {
    document.getElementById("ok").hidden = false;
    document.getElementById("code").textContent = code;
    document.getElementById("copy").onclick = async () => {
      try { await navigator.clipboard.writeText(code); document.getElementById("copy").textContent = "Copied"; }
      catch (e) { document.getElementById("copy").textContent = "Select and copy it manually"; }
    };
  } else if (!q.get("error")) {
    document.getElementById("err").hidden = false;
    document.querySelector("#err p").textContent =
      "Nothing to do here yet. TikTok sends you to this page after you approve the uploader's login, and the code will show up then.";
  } else {
    document.getElementById("err").hidden = false;
    document.getElementById("errmsg").textContent =
      (q.get("error") || "") + " " + (q.get("error_description") || "");
  }
</script>
</body>
</html>
